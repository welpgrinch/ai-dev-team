<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <!-- ==== HEAD: meta, fonts, title ==== -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
                 font-src https://fonts.gstatic.com; script-src 'unsafe-inline';
                 img-src 'self' data:; base-uri 'none'; form-action 'none';">
  <meta name="description" content="Portfolio of a contemporary visual artist.">
  <title>Artist Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600&family=Inter:wght@400;500&subset=latin&display=swap">

  <style>
    /* ==== STYLE: TOKENS ==== */
    :root {
      color-scheme: dark;

      /* Colour (dark default).
         Contrast on --color-bg #0e0e10: fg #f2f0ea = 16.9:1, muted #a7a5a0 = 7.8:1 (WCAG AAA). */
      --color-bg: #0e0e10;
      --color-fg: #f2f0ea;
      --color-muted: #a7a5a0;
      --color-accent: #d9a85a;
      --color-glass: rgb(255 255 255 / .06);
      --color-glass-border: rgb(255 255 255 / .12);
      --color-highlight: rgb(255 255 255 / .18);
      --color-focus: var(--color-accent);

      /* Typography */
      --font-display: "Fraunces", Fraunces-fallback, Georgia, "Times New Roman", serif;
      --font-body: "Inter", Inter-fallback, system-ui, -apple-system, "Segoe UI", Helvetica,
        Arial, sans-serif;
      --step--1: clamp(.875rem, .85rem + .15vw, .9375rem);
      --step-0: clamp(1rem, .95rem + .25vw, 1.125rem);
      --step-1: clamp(1.25rem, 1.1rem + .6vw, 1.5rem);
      --step-2: clamp(1.5rem, 1.25rem + 1.1vw, 2rem);
      --step-3: clamp(1.875rem, 1.4rem + 2vw, 2.75rem);
      --step-4: clamp(2.25rem, 1.5rem + 3.5vw, 4rem);
      --step-5: clamp(2.75rem, 1.5rem + 5.5vw, 6rem);
      --tracking-tight: -.03em;
      --tracking-normal: 0;
      --tracking-wide: .12em;
      --leading-tight: 1.05;
      --leading-body: 1.6;

      /* Spacing / shape */
      --space-1: .25rem;
      --space-2: .5rem;
      --space-3: 1rem;
      --space-4: 1.5rem;
      --space-5: 2rem;
      --space-6: 3rem;
      --space-7: 5rem;
      --space-8: 8rem;
      --radius-card: 1rem;
      --radius-pill: 999px;
      --measure: 65ch;
      --container: 72rem;

      /* Motion */
      --dur-base: 400ms;
      --dur-fast: 200ms;
      --ease-out: cubic-bezier(.22,1,.36,1);
      --ease-spring: cubic-bezier(.34,1.56,.64,1);
      --tilt-max: 8deg;

      /* Shadow */
      --shadow-card: 0 1.5rem 3rem rgb(0 0 0 / .45);
    }

    [data-theme="light"] {
      color-scheme: light;

      /* Contrast on --color-bg #f4f1ea: fg #121212 = 16.6:1, muted #5c5a55 = 6.1:1
         (WCAG AAA / AA). */
      --color-bg: #f4f1ea;
      --color-fg: #121212;
      --color-muted: #5c5a55;
      --color-glass: rgb(255 255 255 / .55);
      --color-glass-border: rgb(0 0 0 / .1);
      --color-highlight: rgb(255 255 255 / .9);
      --shadow-card: 0 1.5rem 3rem rgb(20 18 12 / .14);

      /* S09: light accent. Contrast on --color-bg #f4f1ea: accent #8a5a1c = 5.2:1 (WCAG AA),
         so link hover text and focus rings (--color-focus -> --color-accent) pass. */
      --color-accent: #8a5a1c;
    }

    /* ==== STYLE: BASE & TYPOGRAPHY ==== */
    @font-face {
      font-family: "Fraunces-fallback";
      src: local("Georgia");
      size-adjust: 104%;
      ascent-override: 92%;
      descent-override: 24%;
      line-gap-override: 0%;
    }

    @font-face {
      font-family: "Inter-fallback";
      src: local("Arial");
      size-adjust: 107%;
      ascent-override: 90%;
      descent-override: 22%;
      line-gap-override: 0%;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    * {
      margin: 0;
    }

    html {
      font-size: 100%;
      -webkit-text-size-adjust: 100%;
      scroll-behavior: smooth;
    }

    body {
      background: var(--color-bg);
      color: var(--color-fg);
      font-family: var(--font-body);
      font-size: var(--step-0);
      line-height: var(--leading-body);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    h1,
    h2,
    h3 {
      font-family: var(--font-display);
      font-weight: 600;
      letter-spacing: var(--tracking-tight);
      line-height: var(--leading-tight);
      text-wrap: balance;
    }

    h1 {
      font-size: var(--step-5);
    }

    h2 {
      font-size: var(--step-3);
    }

    h3 {
      font-size: var(--step-1);
    }

    p {
      max-width: var(--measure);
    }

    a {
      color: inherit;
      text-decoration-color: var(--color-accent);
      text-underline-offset: .15em;
    }

    a:hover {
      color: var(--color-accent);
    }

    :focus-visible {
      outline: 2px solid var(--color-focus);
      outline-offset: 3px;
      border-radius: 2px;
    }

    :focus:not(:focus-visible) {
      outline: none;
    }

    img,
    svg {
      display: block;
      max-width: 100%;
    }

    ul[class] {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    button {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
    }

    ::selection {
      background: var(--color-accent);
      color: var(--color-bg);
    }

    /* ==== STYLE: LAYOUT ==== */
    /* S04: grid columns; S03 owns all other layout */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 18rem), 1fr));
      gap: var(--space-4);
    }

    /* S09: header/nav; S03 owns all other layout */
    .nav {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--color-glass);
      border-bottom: 1px solid var(--color-glass-border);
      box-shadow: inset 0 1px 0 var(--color-highlight);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    @supports not (backdrop-filter: blur(1px)) {
      .nav {
        background: var(--color-bg);
      }
    }

    .nav__inner {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2) var(--space-4);
      max-width: var(--container);
      margin: 0 auto;
      padding: var(--space-2) var(--space-3);
    }

    .nav__brand {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      font-family: var(--font-display);
      font-size: var(--step-0);
      font-weight: 600;
      letter-spacing: var(--tracking-tight);
      text-decoration: none;
    }

    .nav__links {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-2) var(--space-4);
    }

    .nav__link {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      font-family: var(--font-body);
      font-size: var(--step--1);
      letter-spacing: var(--tracking-wide);
      text-transform: uppercase;
      text-decoration: none;
      opacity: .6;
      transition: opacity var(--dur-fast) var(--ease-out);
    }

    .nav__link[aria-current="true"],
    .nav__link:hover,
    .nav__link:focus-visible {
      opacity: 1;
    }

    /* ==== STYLE: CARD / GLASS ==== */
    .tile {
      display: block;
      width: 100%;
      text-align: left;
      position: relative;
      border-radius: var(--radius-card);
      background: var(--color-glass);
      border: 1px solid var(--color-glass-border);
      box-shadow: var(--shadow-card), inset 0 1px 0 var(--color-highlight);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      overflow: hidden;
      transform-style: preserve-3d;
      transition: transform var(--dur-base) var(--ease-out);
    }

    .tile[data-tilt] {
      transform: perspective(900px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg))
                 translateZ(var(--lift, 0px));
    }

    .tile:focus-visible {
      border-radius: var(--radius-card);
    }

    @supports not (backdrop-filter: blur(1px)) {
      .tile {
        background: color-mix(in srgb, var(--color-glass), var(--color-bg) 60%);
      }
    }

    .tile__media {
      display: block;
      aspect-ratio: 4 / 5;
      overflow: hidden;
    }

    .tile__media > svg,
    .tile__media > img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .tile__sheen {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(circle at var(--sx,50%) var(--sy,50%),
                  rgb(255 255 255 / .18), transparent 60%);
      transition: opacity var(--dur-base) var(--ease-out);
    }

    .tile:hover .tile__sheen,
    .tile:focus-visible .tile__sheen {
      opacity: 1;
    }

    .tile__caption {
      display: flex;
      flex-direction: column;
      gap: var(--space-1);
      padding: var(--space-3) var(--space-4) var(--space-4);
    }

    .tile__title {
      font-family: var(--font-display);
      font-size: var(--step-1);
      font-weight: 600;
      letter-spacing: var(--tracking-tight);
      line-height: var(--leading-tight);
    }

    .tile__meta {
      font-family: var(--font-body);
      font-size: var(--step--1);
      color: var(--color-muted);
    }

    .grid-fallback {
      display: grid;
      gap: var(--space-2);
      color: var(--color-muted);
    }

    /* S06: single fixed soft radial light; JS writes --lx/--ly, CSS consumes in transform */
    .pointer-light {
      position: fixed;
      top: 0;
      left: 0;
      width: 40rem;
      height: 40rem;
      pointer-events: none;
      z-index: 0;
      opacity: 0;
      border-radius: 50%;
      background: radial-gradient(circle,
                  color-mix(in srgb, var(--color-accent) 18%, transparent), transparent 70%);
      transform: translate3d(calc(var(--lx, 50vw) - 50%), calc(var(--ly, 50vh) - 50%), 0);
      transition: opacity var(--dur-base) var(--ease-out);
      will-change: transform;
    }

    .pointer-light.is-active {
      opacity: 1;
    }

    /* ==== STYLE: LIGHTBOX ==== */

    /* ==== STYLE: MOTION & MEDIA QUERIES ==== */
    /* S06: hide the pointer light and flatten lift on coarse pointers / reduced motion */
    @media (pointer: coarse) {
      .pointer-light {
        display: none;
      }

      .tile[data-tilt] {
        --lift: 0px;
      }
    }

    /* S08: scroll reveal — initial state only when JS is active (html.js), end state below */
    html.js [data-reveal] {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity var(--dur-base) var(--ease-out),
                  transform var(--dur-base) var(--ease-out);
    }

    html.js [data-reveal].is-visible {
      opacity: 1;
      transform: none;
    }

    @media (prefers-reduced-motion: reduce) {
      :root {
        --dur-base: 0ms;
        --dur-fast: 0ms;
      }

      .pointer-light {
        display: none;
      }

      .tile[data-tilt] {
        --lift: 0px;
      }

      html.js [data-reveal] {
        opacity: 1;
        transform: none;
      }
    }

    html[data-motion="off"] .pointer-light {
      display: none;
    }

    html[data-motion="off"] [data-reveal] {
      opacity: 1;
      transform: none;
      transition: none;
    }

    /* S09: nav current-section state is attribute-driven; drop the opacity transition */
    html[data-motion="off"] .nav__link {
      transition: none;
    }

  </style>
</head>
<body>
  <!-- ==== BODY: MARKUP ==== -->
  <header data-nav class="nav">
    <nav aria-label="Primary" class="nav__inner">

  <main>

  </main>

  <footer>
    <p>&copy; Artist Name</p>
  </footer>

  <dialog class="lightbox" data-lightbox></dialog>
  <div class="pointer-light" data-pointer-light aria-hidden="true"></div>

  <!-- ==== SCRIPT ==== -->
  <script>
    "use strict";
    // ==== DATA: ARTWORKS ====
    // Twelve records; `paletteSeed` is "<hue>-<composition>" from Renderer.SEEDS.
    // Optional `src` (image URL) replaces the SVG placeholder when present.
    const ARTWORKS = [
      {
        id: "low-tide-dungeness",
        title: "Low Tide, Dungeness",
        medium: "Oil on linen",
        dimensions: "120 × 90 cm",
        year: 2024,
        alt: "Three horizontal bands of ochre, sand and pale grey, like a flat shingle shoreline.",
        paletteSeed: "ochre-bands",
      },
      {

        year: 2023,

      },
      {

        dimensions: "150 × 120 cm",
        year: 2022,

      },
      {

        medium: "Acrylic and marble dust on panel",
        dimensions: "90 × 70 cm",
        year: 2024,
        alt: "Four slate-blue rectangles stacked and slightly offset, lightening toward the top.",
        paletteSeed: "slate-stack",
      },
      {
        id: "slate-weir",
        title: "Slate Weir",
        medium: "Silver gelatin print",
        dimensions: "40 × 50 cm",
        year: 2021,
        alt: "Cool grey-blue horizontal bands with a darker band low in the frame like a weir.",
        paletteSeed: "slate-bands",
      },
      {
        id: "meridian",
        title: "Meridian",
        medium: "Cast bronze with patina",
        dimensions: "38 × 22 × 14 cm",
        year: 2023,
        alt: "A broad plum-toned arc sweeping across a deep aubergine ground.",
        paletteSeed: "plum-arc",
      },
      {
        id: "ferrous-bloom",
        title: "Ferrous Bloom",
        medium: "Iron oxide and casein on board",
        dimensions: "80 × 100 cm",
        year: 2020,
        alt: "A rust-red field with a small pale rectangle sitting low in the composition.",
        paletteSeed: "oxide-field",
      },
      {
        id: "understory",
        title: "Understory",
        medium: "Egg tempera on gessoed panel",
        dimensions: "60 × 75 cm",
        year: 2022,
        alt: "Stacked moss-green blocks, each a step lighter, climbing from the base of the frame.",
        paletteSeed: "moss-stack",
      },
      {
        id: "harbour-signals",
        title: "Harbour Signals",
        medium: "Screenprint on Somerset Satin",
        dimensions: "70 × 100 cm",
        year: 2019,
        alt: "Ochre and umber horizontal bands in three unequal widths, printed with flat inks.",
        paletteSeed: "ochre-bands",
      },
      {
        id: "night-orchard",
        title: "Night Orchard",
        medium: "Oil and cold wax on linen",
        dimensions: "100 × 125 cm",
        year: 2023,
        alt: "A dark plum field broken by one small lighter rectangle, like a window at dusk.",
        paletteSeed: "plum-field",
      },
      {
        id: "shale-hours",
        title: "Shale Hours",
        medium: "Graphite and pigment on paper",
        dimensions: "42 × 59 cm",
        year: 2021,
        alt: "A slate-grey arc curving over a near-black ground, drawn with soft flat tone.",
        paletteSeed: "slate-arc",
      },
      {
        id: "ballast",
        title: "Ballast",
        medium: "Glazed stoneware",
        dimensions: "34 × 30 × 30 cm",
        year: 2024,
        alt: "Warm ochre blocks stacked and offset, heavy at the base and lighter at the crown.",
        paletteSeed: "ochre-stack",
      },
    ];

    // ==== CAPABILITIES ====
    // Created in S06 as a prerequisite (S05 blocked); S05 must reuse, not redefine.
    const Capabilities = {
      flags: null,

      detect() {
        if (this.flags) return this.flags;
        const mq = (query) =>
          typeof window.matchMedia === "function" ? window.matchMedia(query).matches : false;
        const flags = {
          reducedMotion: mq("(prefers-reduced-motion: reduce)"),
          coarsePointer: mq("(pointer: coarse)"),
          hasIO: "IntersectionObserver" in window,
        };
        if (flags.reducedMotion || flags.coarsePointer) {
          document.documentElement.dataset.motion = "off";
        }
        this.flags = flags;
        return flags;
      },
    };

    // ==== RENDERER ====
    const Renderer = {
      // Whitelist of seeds. Hues are HSL hue angles; compositions are drawing functions.
      SEEDS: {
        hues: { ochre: 38, oxide: 14, moss: 95, slate: 215, plum: 320 },
        compositions: ["bands", "arc", "field", "stack"],
        fallback: "slate-field",
      },
      REQUIRED: ["id", "title", "medium", "dimensions", "year", "alt", "paletteSeed"],
      _titleCount: 0,

      escape(text) {
        return String(text)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      },

      // Flat colours derived from the hue so placeholders read on both themes.
      palette(hue) {
        return {
          ground: `hsl(${hue} 22% 20%)`,
          mid: `hsl(${hue} 30% 38%)`,
          high: `hsl(${hue} 38% 58%)`,
          pale: `hsl(${hue} 40% 78%)`,
        };
      },

      shapes(composition, p) {
        switch (composition) {
          case "bands":
            return `<rect x="0" y="0" width="400" height="500" fill="${p.ground}"/>` +
              `<rect x="0" y="120" width="400" height="150" fill="${p.mid}"/>` +
              `<rect x="0" y="270" width="400" height="70" fill="${p.high}"/>` +
              `<rect x="0" y="420" width="400" height="80" fill="${p.pale}"/>`;
          case "arc":
            return `<rect x="0" y="0" width="400" height="500" fill="${p.ground}"/>` +
              `<circle cx="200" cy="420" r="260" fill="${p.mid}"/>` +
              `<circle cx="200" cy="470" r="200" fill="${p.high}"/>`;
          case "field":
            return `<rect x="0" y="0" width="400" height="500" fill="${p.mid}"/>` +
              `<rect x="30" y="30" width="340" height="440" fill="${p.ground}"/>` +
              `<rect x="250" y="90" width="80" height="60" fill="${p.pale}"/>`;
          case "stack":
          default:
            return `<rect x="0" y="0" width="400" height="500" fill="${p.ground}"/>` +
              `<rect x="60" y="360" width="280" height="110" fill="${p.mid}"/>` +
              `<rect x="80" y="250" width="240" height="100" fill="${p.high}"/>` +
              `<rect x="100" y="150" width="200" height="90" fill="${p.pale}"/>` +
              `<rect x="120" y="70" width="160" height="70" fill="${p.high}"/>`;
        }
      },

      placeholderSVG(seed, alt) {
        const { hues, compositions, fallback } = this.SEEDS;
        let [hue, composition] = String(seed).split("-");
        if (!(hue in hues) || !compositions.includes(composition)) {
          console.warn(`Renderer: unknown paletteSeed "${seed}", using "${fallback}"`);
          [hue, composition] = fallback.split("-");
        }
        const p = this.palette(hues[hue]);
        const titleId = `tile-title-${++this._titleCount}`;
        return `<svg viewBox="0 0 400 500" role="img" aria-labelledby="${titleId}" ` +
          `xmlns="http://www.w3.org/2000/svg" focusable="false">` +
          `<title id="${titleId}">${this.escape(alt)}</title>` +
          this.shapes(composition, p) +
          `</svg>`;
      },

      validate(record, seenIds) {
        const label = record && record.id ? record.id : "(no id)";
        for (const field of this.REQUIRED) {
          const value = record ? record[field] : undefined;
          if (value === undefined || value === null || value === "") {
            console.warn(`ARTWORKS: skipping record ${label}`, `missing field "${field}"`);
            return false;
          }
        }
        if (!Number.isInteger(record.year)) {
          console.warn(`ARTWORKS: skipping record ${label}`, "year is not an integer");
          return false;
        }
        if (seenIds.has(record.id)) {
          console.warn(`ARTWORKS: skipping record ${label}`, "duplicate id");
          return false;
        }
        seenIds.add(record.id);
        return true;
      },

      render(artworks, gridEl) {
        gridEl.replaceChildren();
        const seenIds = new Set();
        const fragment = document.createDocumentFragment();
        for (const art of artworks) {
          if (!this.validate(art, seenIds)) continue;

          const item = document.createElement("li");
          item.className = "tile-item";

          const button = document.createElement("button");
          button.className = "tile";
          button.type = "button";
          button.dataset.tilt = "";
          button.dataset.lightboxTrigger = "";
          button.dataset.id = art.id;
          button.setAttribute("aria-label", `${art.title}, ${art.medium}, ${art.year}`);

          const media = document.createElement("span");
          media.className = "tile__media";
          if (art.src) {
            const img = document.createElement("img");
            img.src = art.src;
            img.alt = art.alt;
            img.loading = "lazy";
            media.append(img);
          } else {
            // Only innerHTML use: whitelisted seed + escaped alt (see placeholderSVG).
            media.innerHTML = this.placeholderSVG(art.paletteSeed, art.alt);
          }

          const sheen = document.createElement("span");
          sheen.className = "tile__sheen";
          sheen.setAttribute("aria-hidden", "true");

          const caption = document.createElement("span");
          caption.className = "tile__caption";
          const title = document.createElement("span");
          title.className = "tile__title";
          title.textContent = art.title;
          const meta = document.createElement("span");
          meta.className = "tile__meta";
          meta.textContent = `${art.medium} · ${art.year}`;
          caption.append(title, meta);

          button.append(media, sheen, caption);
          item.append(button);
          fragment.append(item);
        }
        gridEl.append(fragment);
        return gridEl.querySelectorAll("[data-lightbox-trigger]");
      },
    };

    // ==== TILT ====
    // Shared by Tilt (S05) and PointerLight (S06)
    // Pure; returns [nextValue, nextVelocity]
    function spring(cur, target, vel, k = 0.18, d = 0.75) {
      vel = (vel + (target - cur) * k) * d;
      return [cur + vel, vel];
    }

    // ==== POINTER LIGHT ====
    const PointerLight = {
      RADIUS: 320,
      LIFT_MAX: 18,
      SETTLE: 0.1,
      DEBOUNCE_MS: 150,

      lightEl: null,
      tiles: [],
      rects: [],
      targetX: 0,
      targetY: 0,
      curX: 0,
      curY: 0,
      velX: 0,
      velY: 0,
      running: false,
      frameId: 0,
      debounceId: 0,
      lifting: true,
      // Scroll offset cached here so tick() never reads window.scrollX/Y (NFR-05).
      scrollX: 0,
      scrollY: 0,

      init(lightEl, tiles, caps) {
        if (!lightEl || !caps || caps.reducedMotion || caps.coarsePointer) return;
        if (!tiles || tiles.length === 0) return;
        this.lightEl = lightEl;
        this.tiles = Array.from(tiles);
        this.cacheRects();

        this._onMove = (event) => {
          this.targetX = event.clientX;
          this.targetY = event.clientY;
          if (!this.lifting) {
            this.lifting = true;
            this.lightEl.classList.add("is-active");
          }
          this.ensureLoop();
        };
        this._onLeave = () => {
          this.lifting = false;
          this.lightEl.classList.remove("is-active");
          this.ensureLoop();
        };
        this._onRelayout = () => {
          // Scroll offset is refreshed immediately; rects are re-read debounced.
          this.scrollX = window.scrollX;
          this.scrollY = window.scrollY;
          clearTimeout(this.debounceId);
          this.debounceId = setTimeout(this._recache, this.DEBOUNCE_MS);
        };
        this._recache = () => {
          this.cacheRects();
          this.ensureLoop();
        };
        this._tick = () => this.tick();

        this.lifting = false;
        window.addEventListener("pointermove", this._onMove, { passive: true });
        window.addEventListener("resize", this._onRelayout, { passive: true });
        window.addEventListener("scroll", this._onRelayout, { passive: true });
        document.documentElement.addEventListener("pointerleave", this._onLeave);
        document.documentElement.addEventListener("mouseleave", this._onLeave);
      },

      // Only place getBoundingClientRect is read; centres stored in page coordinates.
      cacheRects() {
        this.scrollX = window.scrollX;
        this.scrollY = window.scrollY;
        this.rects = this.tiles.map((el, i) => {
          const b = el.getBoundingClientRect();
          const prev = this.rects[i];
          return {
            el,
            cx: b.left + b.width / 2 + this.scrollX,
            cy: b.top + b.height / 2 + this.scrollY,
            r: Math.hypot(b.width, b.height) / 2,
            last: prev && prev.el === el ? prev.last : null,
          };
        });
      },

      ensureLoop() {
        if (this.running) return;
        this.running = true;
        this.frameId = requestAnimationFrame(this._tick);
      },

      tick() {
        const s = this.SETTLE;
        [this.curX, this.velX] = spring(this.curX, this.targetX, this.velX);
        [this.curY, this.velY] = spring(this.curY, this.targetY, this.velY);
        const settled =
          Math.abs(this.targetX - this.curX) < s && Math.abs(this.velX) < s &&
          Math.abs(this.targetY - this.curY) < s && Math.abs(this.velY) < s;
        if (settled) {
          this.curX = this.targetX;
          this.curY = this.targetY;
          this.velX = 0;
          this.velY = 0;
        }

        const style = this.lightEl.style;
        style.setProperty("--lx", `${this.curX.toFixed(1)}px`);
        style.setProperty("--ly", `${this.curY.toFixed(1)}px`);

        const sx = this.scrollX;
        const sy = this.scrollY;
        const radius = this.RADIUS;
        const rects = this.rects;
        for (let i = 0; i < rects.length; i++) {
          const t = rects[i];
          let lift = 0;
          if (this.lifting) {
            const d = Math.hypot(t.cx - sx - this.curX, t.cy - sy - this.curY);
            if (d < radius) lift = Math.round(this.LIFT_MAX * (1 - d / radius));
          }
          if (lift !== t.last) {
            t.last = lift;
            t.el.style.setProperty("--lift", `${lift}px`);
          }
        }

        if (settled) {
          cancelAnimationFrame(this.frameId);
          this.frameId = 0;
          this.running = false;
          return;
        }
        this.frameId = requestAnimationFrame(this._tick);
      },
    };

    // ==== REVEAL ====
    // Adds .is-visible once per [data-reveal] section; CSS owns the fade-and-rise end-state.
    const Reveal = {
      THRESHOLD: 0.15,
      ROOT_MARGIN: "0px 0px -10% 0px",
      observer: null,

      init(sections, caps) {
        if (!sections || sections.length === 0) return;
        if (!caps || caps.reducedMotion || !caps.hasIO) {
          this.showAll(sections);
          return;
        }
        let pending = sections.length;
        this.observer = new IntersectionObserver((entries, observer) => {
          for (const entry of entries) {
            if (!entry.isIntersecting) continue;
            entry.target.classList.add("is-visible");
            observer.unobserve(entry.target);
            pending--;
          }
          if (pending <= 0) {
            observer.disconnect();
            this.observer = null;
          }
        }, { threshold: this.THRESHOLD, rootMargin: this.ROOT_MARGIN });
        for (const section of sections) this.observer.observe(section);
      },

      // Synchronous fallback: reduced motion, missing IntersectionObserver.
      showAll(sections) {
        for (const section of sections) section.classList.add("is-visible");
      },
    };

    // S09: current-section nav state; lives here because it shares the IntersectionObserver
    // pattern. Toggles aria-current only; CSS owns the opacity end-state.
    const Nav = {
      ROOT_MARGIN: "-40% 0px -55% 0px",
      links: [],
      byId: null,
      observer: null,

      init(links, sections, caps) {
        this.links = links ? Array.from(links) : [];
        this.byId = new Map();
        for (const link of this.links) {
          const href = link.getAttribute("href") || "";
          if (href.startsWith("#") && href.length > 1) this.byId.set(href.slice(1), link);
        }
        if (this.links.length === 0 || !sections || sections.length === 0) return;
        if (!caps || !caps.hasIO) return;
        this.observer = new IntersectionObserver((entries) => {
          for (const entry of entries) {
            if (entry.isIntersecting) this.setCurrent(entry.target.id);
          }
        }, { threshold: 0, rootMargin: this.ROOT_MARGIN });
        for (const section of sections) this.observer.observe(section);
      },

      setCurrent(id) {
        for (const link of this.links) {
          if (this.byId.get(id) === link) link.setAttribute("aria-current", "true");
          else link.removeAttribute("aria-current");
        }
      },
    };

    // ==== LIGHTBOX ====

    // ==== BOOTSTRAP ====
    const Bootstrap = {
      start() {
        document.documentElement.classList.add("js");
        const caps = Capabilities.detect();
        const grid = document.querySelector("[data-grid]");
        const tiles = grid ? Renderer.render(ARTWORKS, grid) : [];
        const light = document.querySelector("[data-pointer-light]");
        if (!caps.reducedMotion && !caps.coarsePointer) PointerLight.init(light, tiles, caps);
        Reveal.init(document.querySelectorAll("[data-reveal]"), caps);
        Nav.init(document.querySelectorAll("[data-nav-link]"),
          document.querySelectorAll("main section[id]"), caps);
        // S05: Tilt.init(tiles, caps)  S07: Lightbox
      },
    };

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", () => Bootstrap.start());
    } else {
      Bootstrap.start();
    }

  </script>
</body>
</html>
