name: Release

# Publishes to the VS Code Marketplace when a tag like v0.1.0 is pushed.
# Requires the repository secret VSCE_PAT (Azure DevOps Personal Access Token with Marketplace > Manage scope).
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run package
      - name: Publish to Marketplace
        run: npx --yes @vscode/vsce publish --packagePath *.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: Attach VSIX to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.vsix'
          generate_release_notes: true
